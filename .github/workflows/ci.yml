name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      # Lets tests/integration create and seed its own querygenie_test database
      QG_TEST_MYSQL_ADMIN_URL: mysql+pymysql://root:ci-root-password@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests evals scripts
      - run: pytest
      - name: Evaluation harness self-check (gold answers, no model calls)
        env:
          GEMINI_API_KEY: not-used
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: querygenie_eval
          DB_USER: querygenie_eval_ro
          DB_PASSWORD: ci-readonly-password
          DB_ADMIN_USER: root
          DB_ADMIN_PASSWORD: ci-root-password
        run: |
          python -m scripts.setup_db
          python -m evals.run --gold

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
